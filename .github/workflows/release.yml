name: Create Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Extension ZIP
        run: |
          mkdir -p staging release
          cp manifest.json content.js reskin.css popup.html popup.js README.md INSTALL.txt staging/
          cp -r icons staging/
          cd staging
          zip -r ../release/etlab-mits-reskin-${{ github.ref_name || 'latest' }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.zip
          generate_release_notes: true
